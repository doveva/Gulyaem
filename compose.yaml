name: gulyaem

services:
  db:
    build:
      context: ./infra/postgis
    image: gulyaem/postgis:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gulyaem}
      POSTGRES_USER: ${POSTGRES_USER:-gulyaem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gulyaem}
    ports:
      - "${POSTGRES_PORT:-5532}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-gulyaem}:${POSTGRES_PASSWORD:-gulyaem}@db:5432/${POSTGRES_DB:-gulyaem}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    image: gulyaem/backend:stage1
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gulyaem}:${POSTGRES_PASSWORD:-gulyaem}@db:5432/${POSTGRES_DB:-gulyaem}?sslmode=disable
      HTTP_ADDRESS: :8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEO_DATA_PATH: /data
      GEO_TEST_AREA: ${GEO_TEST_AREA:-}
      DISTRICT_TEST_AREA: ${DISTRICT_TEST_AREA:-spb-administrative-districts}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  geo-import:
    build:
      context: ./backend
    image: gulyaem/backend:stage1
    entrypoint: ["geo-import"]
    command:
      - --fixture
      - ${GEO_TEST_AREA:-spb-stage1-validation}
      - --normalization-version
      - ${NORMALIZATION_VERSION:-stage1-segments-v1}
      - --max-segment-length-m
      - ${MAX_SEGMENT_LENGTH_M:-0}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gulyaem}:${POSTGRES_PASSWORD:-gulyaem}@db:5432/${POSTGRES_DB:-gulyaem}?sslmode=disable
      HTTP_ADDRESS: :8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEO_DATA_PATH: /data
      GEO_TEST_AREA: ${GEO_TEST_AREA:-spb-stage1-validation}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_SEGMENT_LENGTH_M: ${MAX_SEGMENT_LENGTH_M:-0}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]
    restart: "no"

  district-import:
    build:
      context: ./backend
    image: gulyaem/backend:stage1
    entrypoint: ["district-import"]
    command:
      - --fixture
      - ${DISTRICT_TEST_AREA:-spb-administrative-districts}
      - --normalization-version
      - ${DISTRICT_NORMALIZATION_VERSION:-stage1-districts-v1}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gulyaem}:${POSTGRES_PASSWORD:-gulyaem}@db:5432/${POSTGRES_DB:-gulyaem}?sslmode=disable
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEO_DATA_PATH: /data
      DISTRICT_TEST_AREA: ${DISTRICT_TEST_AREA:-spb-administrative-districts}
      DISTRICT_NORMALIZATION_VERSION: ${DISTRICT_NORMALIZATION_VERSION:-stage1-districts-v1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
        VITE_CITY_ID: ${VITE_CITY_ID:-01900000-0000-7000-8000-000000000001}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.7.0
    profiles: ["routing-spike"]
    environment:
      build_admins: "False"
      build_time_zones: "False"
      build_elevation: "False"
      build_tar: "True"
      server_threads: "2"
      use_tiles_ignore_pbf: "True"
    ports:
      - "${VALHALLA_PORT:-8002}:8002"
    volumes:
      - ./.routing/valhalla:/custom_files
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8002/status"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 5s
    restart: unless-stopped

  graphhopper:
    build:
      context: ./infra/routing/graphhopper
      args:
        GRAPHHOPPER_VERSION: "11.0"
    image: gulyaem/graphhopper:11.0
    profiles: ["routing-spike"]
    ports:
      - "${GRAPHHOPPER_PORT:-8989}:8989"
    volumes:
      - ./data/test-areas/spb-stage1-validation/spb-stage1-validation.osm.pbf:/data/spb-stage1-validation.osm.pbf:ro
      - ./.routing/graphhopper:/graph
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8989/info"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 5s
    restart: unless-stopped

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v26.7.3-debian
    profiles: ["routing-spike"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        checksum="$$(sha256sum /data/spb-stage1-validation.osm.pbf | cut -d ' ' -f 1)"
        if [ ! -f /routing/.prepared-sha256 ] || [ "$$(cat /routing/.prepared-sha256)" != "$$checksum" ]; then
          find /routing -maxdepth 1 -type f -name 'spb-stage1-validation.osrm*' -delete
          cp /data/spb-stage1-validation.osm.pbf /routing/spb-stage1-validation.osm.pbf
          osrm-extract -p /opt/foot.lua /routing/spb-stage1-validation.osm.pbf
          osrm-partition /routing/spb-stage1-validation.osrm
          osrm-customize /routing/spb-stage1-validation.osrm
          printf '%s' "$$checksum" > /routing/.prepared-sha256
        fi
        if [ -r /sys/fs/cgroup/memory.peak ]; then
          cat /sys/fs/cgroup/memory.peak > /routing/.prepare-peak-memory-bytes
        fi
    volumes:
      - ./data/test-areas/spb-stage1-validation/spb-stage1-validation.osm.pbf:/data/spb-stage1-validation.osm.pbf:ro
      - ./.routing/osrm:/routing
    restart: "no"

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.7.3-debian
    profiles: ["routing-spike"]
    command: ["osrm-routed", "--algorithm", "mld", "/routing/spb-stage1-validation.osrm"]
    ports:
      - "${OSRM_PORT:-5001}:5000"
    volumes:
      - ./.routing/osrm:/routing:ro
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
