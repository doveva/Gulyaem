name: gulyaem

services:
  db:
    build:
      context: ./infra/postgis
    image: gulyaem/postgis:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gulyaem}
      POSTGRES_USER: ${POSTGRES_USER:-gulyaem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gulyaem}
    ports:
      - "${POSTGRES_PORT:-5532}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-gulyaem}:${POSTGRES_PASSWORD:-gulyaem}@db:5432/${POSTGRES_DB:-gulyaem}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    image: gulyaem/backend:stage1
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gulyaem}:${POSTGRES_PASSWORD:-gulyaem}@db:5432/${POSTGRES_DB:-gulyaem}?sslmode=disable
      HTTP_ADDRESS: :8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEO_DATA_PATH: /data
      GEO_TEST_AREA: ${GEO_TEST_AREA:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  geo-import:
    build:
      context: ./backend
    image: gulyaem/backend:stage1
    entrypoint: ["geo-import"]
    command:
      - --fixture
      - ${GEO_TEST_AREA:-spb-dense-center}
      - --normalization-version
      - ${NORMALIZATION_VERSION:-stage1-v1}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gulyaem}:${POSTGRES_PASSWORD:-gulyaem}@db:5432/${POSTGRES_DB:-gulyaem}?sslmode=disable
      HTTP_ADDRESS: :8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEO_DATA_PATH: /data
      GEO_TEST_AREA: ${GEO_TEST_AREA:-spb-dense-center}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
